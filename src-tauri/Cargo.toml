[package]
name = "mdedit"
version = "0.6.3"
description = "A WYSIWYG Markdown editor built with Tauri and Leptos"
authors = ["alf5"]
edition = "2021"
license = "MIT"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mdedit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23.1"
diffy = { version = "0.5", features = ["std"] }
notify = "8"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

# A second launch forwards its argv to the running window as new tabs instead
# of opening another process. Desktop-only, as the plugin's docs prescribe.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"

# Exporting a PDF means driving the print machinery the platform's webview
# already owns, reached through `tauri::WebviewWindow::with_webview`. Each of
# these is a crate wry already pulls in, so this adds nothing to the tree —
# but the versions have to keep step with Tauri's, hence pinning Tauri to a
# minor version, as its `with_webview` docs prescribe.
[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSPrintInfo", "NSPrintOperation"] }
objc2-foundation = { version = "0.3", features = ["NSDictionary", "NSString", "NSURL"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
