name: build

on:
  push:
    branches: [main, v2-gpui]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Needed to create releases and upload their assets on tag builds.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # GPUI's build-time system libraries on Ubuntu. libxcb and libxkbcommon
  # are linked; the rest are loaded at run time but their headers keep the
  # -sys crates' build scripts happy.
  LINUX_DEPS: >-
    libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev
    libfontconfig-dev libvulkan-dev

# Pushing a tag together with the branch triggers two identical builds for
# the same commit. Same-commit runs share a group; an incoming tag run
# cancels the duplicate branch run, but never the reverse: the tag run
# publishes the release and must not be cancelled.
concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The UI tests run on GPUI's headless test platform: no display needed.
      - run: cargo test --workspace --locked

  package:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
          - os: macos-latest
            name: macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Install packaging tools
        uses: taiki-e/install-action@v2
        with:
          tool: ${{ runner.os == 'Linux' && 'cargo-packager,cargo-generate-rpm' || 'cargo-packager' }}

      # The release profile at the workspace root strips the binary.
      - name: Build
        if: runner.os != 'macOS'
        run: cargo build --release --locked -p mdedit

      # One binary for both Apple Silicon and Intel, placed where the
      # packager looks for the release build.
      - name: Build (universal)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --locked -p mdedit --target aarch64-apple-darwin
          cargo build --release --locked -p mdedit --target x86_64-apple-darwin
          mkdir -p target/release
          lipo -create -output target/release/mdedit \
            target/aarch64-apple-darwin/release/mdedit \
            target/x86_64-apple-darwin/release/mdedit

      # Windows only makes the NSIS installer unless asked: ask for the MSI
      # (WiX) too.
      - name: Package
        env:
          # linuxdeploy is itself an AppImage; runners have no FUSE.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: cargo packager --release -p mdedit ${{ runner.os == 'Windows' && '--formats nsis,wix' || '' }}

      - name: Package (RPM)
        if: runner.os == 'Linux'
        run: cargo generate-rpm -p crates/mdedit -o target/packages/

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p dist-artifacts
          case "${{ matrix.name }}" in
            linux-x86_64)   cp target/release/mdedit dist-artifacts/mdedit-linux-x86_64 ;;
            windows-x86_64) cp target/release/mdedit.exe dist-artifacts/mdedit-windows-x86_64.exe ;;
            macos-universal)
              cp target/release/mdedit dist-artifacts/mdedit-macos-universal
              (cd target/packages && zip -qr ../../dist-artifacts/mdedit.app.zip mdedit.app) || true
              ;;
          esac
          find target/packages -maxdepth 1 -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.exe' \
               -o -name '*.msi' -o -name '*.dmg' \) -exec cp {} dist-artifacts/ \;
          # The disk image is named for the runner's arch, but the app in it
          # is universal.
          for f in dist-artifacts/*_aarch64.dmg; do
            if [ -e "$f" ]; then mv "$f" "${f/_aarch64.dmg/_universal.dmg}"; fi
          done
          ls -la dist-artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: mdedit-${{ matrix.name }}
          path: dist-artifacts/*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/*
          fail_on_unmatched_files: false
