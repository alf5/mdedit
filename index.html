<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>mdedit</title>
    <script>
      // Stub the Tauri IPC when running in a plain browser (trunk serve
      // without the Tauri shell), so the UI stays fully functional for
      // frontend development. Inside Tauri, withGlobalTauri wins.
      if (!window.__TAURI__) {
        const listeners = {};
        window.__TAURI__ = {
          core: { invoke: async () => null },
          event: {
            listen: async (evt, cb) => {
              (listeners[evt] ||= []).push(cb);
              return () => {};
            },
          },
        };
        // Test/dev hook: simulate a backend event.
        window.__TAURI_TEST_EMIT__ = (evt, payload) =>
          (listeners[evt] || []).forEach((cb) => cb({ event: evt, payload }));
      }
    </script>
    <script>
      // Last-resort net. src/error_dialog.rs installs a Rust panic hook and
      // publishes window.__MDEDIT_FATAL__; this catches what it can't reach —
      // a WASM module that fails to fetch or instantiate, so no Rust ever
      // runs. Kept deliberately tiny: the styled dialog lives in Rust.
      (function () {
        var reported = false;
        function fatal(detail) {
          if (window.__MDEDIT_FATAL__) {
            window.__MDEDIT_FATAL__("mdedit hit an internal error", detail);
            return;
          }
          if (reported) return;
          reported = true;
          // Rust never booted, so styles.css may be all we have.
          var d = document.createElement("div");
          d.className = "overlay error-overlay";
          var m = document.createElement("div");
          m.className = "modal error-modal";
          var t = document.createElement("p");
          t.className = "modal-title";
          t.textContent = "mdedit failed to start";
          var p = document.createElement("pre");
          p.className = "error-detail";
          p.textContent = detail;
          m.appendChild(t);
          m.appendChild(p);
          d.appendChild(m);
          (document.body || document.documentElement).appendChild(d);
        }
        window.addEventListener("error", function (e) {
          fatal(String((e && (e.message || e.error)) || "unknown error"));
        });
        window.addEventListener("unhandledrejection", function (e) {
          fatal("Unhandled rejection: " + String((e && e.reason) || "unknown"));
        });
      })();
    </script>
    <!-- document.css first: it defines the color variables styles.css uses,
         and it is the same file src/export.rs embeds into exported HTML. -->
    <link data-trunk rel="css" href="document.css" />
    <link data-trunk rel="css" href="styles.css" />
    <link
      data-trunk
      rel="rust"
      data-wasm-opt="z"
      data-wasm-opt-params="--enable-bulk-memory-opt --enable-nontrapping-float-to-int"
    />
  </head>
  <body></body>
</html>
