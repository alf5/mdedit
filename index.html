<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>mdedit</title>
    <script>
      // Stub the Tauri IPC when running in a plain browser (trunk serve
      // without the Tauri shell), so the UI stays fully functional for
      // frontend development. Inside Tauri, withGlobalTauri wins.
      if (!window.__TAURI__) {
        const listeners = {};
        window.__TAURI__ = {
          core: { invoke: async () => null },
          event: {
            listen: async (evt, cb) => {
              (listeners[evt] ||= []).push(cb);
              return () => {};
            },
          },
        };
        // Test/dev hook: simulate a backend event.
        window.__TAURI_TEST_EMIT__ = (evt, payload) =>
          (listeners[evt] || []).forEach((cb) => cb({ event: evt, payload }));
      }
    </script>
    <link data-trunk rel="css" href="styles.css" />
    <link
      data-trunk
      rel="rust"
      data-wasm-opt="z"
      data-wasm-opt-params="--enable-bulk-memory-opt --enable-nontrapping-float-to-int"
    />
  </head>
  <body></body>
</html>
