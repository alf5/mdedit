[workspace]
resolver = "3"
members = ["crates/mdedit-core", "crates/mdedit"]

[workspace.package]
version = "2.0.0-dev"
edition = "2024"
license = "MIT"
authors = ["alf5"]
repository = "https://github.com/alf5/mdedit"

[workspace.dependencies]
mdedit-core = { path = "crates/mdedit-core" }
# gpui-kit is 0.x and moves fast; pin exactly and bump deliberately.
gpui-kit = "=0.9.1"

# Profiles must live at the workspace root: Cargo ignores profile sections in
# member crates. strip covers the "stripped executables" requirement.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
