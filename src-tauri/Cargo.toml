[package]
name = "mdedit"
version = "0.4.0"
description = "A WYSIWYG Markdown editor built with Tauri and Leptos"
authors = ["alf5"]
edition = "2021"
license = "MIT"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mdedit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23.1"
diffy = { version = "0.5", features = ["std"] }
notify = "8"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

# A second launch forwards its argv to the running window as new tabs instead
# of opening another process. Desktop-only, as the plugin's docs prescribe.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
