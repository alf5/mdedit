name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
          - os: macos-latest
            name: macos-universal
            extra-targets: ",aarch64-apple-darwin,x86_64-apple-darwin"
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: "wasm32-unknown-unknown${{ matrix.extra-targets || '' }}"

      - uses: Swatinem/rust-cache@v2

      - name: Install trunk and tauri-cli
        uses: taiki-e/install-action@v2
        with:
          tool: trunk,tauri-cli

      # Release profile at the workspace root sets strip = true, so all
      # shipped executables are stripped.
      - name: Build
        run: cargo tauri build ${{ matrix.args }}

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p dist-artifacts
          case "${{ matrix.name }}" in
            linux-x86_64)
              cp target/release/mdedit dist-artifacts/mdedit-linux-x86_64
              cp target/release/bundle/deb/*.deb dist-artifacts/ || true
              cp target/release/bundle/rpm/*.rpm dist-artifacts/ || true
              cp target/release/bundle/appimage/*.AppImage dist-artifacts/ || true
              ;;
            windows-x86_64)
              cp target/release/mdedit.exe dist-artifacts/mdedit-windows-x86_64.exe
              cp target/release/bundle/msi/*.msi dist-artifacts/ || true
              cp target/release/bundle/nsis/*.exe dist-artifacts/ || true
              ;;
            macos-universal)
              cp target/universal-apple-darwin/release/mdedit dist-artifacts/mdedit-macos-universal
              cp target/universal-apple-darwin/release/bundle/dmg/*.dmg dist-artifacts/ || true
              (cd target/universal-apple-darwin/release/bundle/macos \
                && zip -qr mdedit.app.zip mdedit.app \
                && cp mdedit.app.zip ../../../../../dist-artifacts/) || true
              ;;
          esac
          ls -la dist-artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: mdedit-${{ matrix.name }}
          path: dist-artifacts/*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/*
          fail_on_unmatched_files: false
